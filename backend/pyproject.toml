[project]
name = "dental-clinic-backend"
version = "1.0.0"
description = "Local dental clinic management system (Algeria) - FastAPI backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: line length handled by formatter; B008: FastAPI Depends() in defaults is idiomatic.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
